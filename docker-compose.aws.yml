# ============================================================================
# Image Gallery - AWS Production Docker Compose
# ============================================================================
# Flask application + Amazon RDS MySQL + Amazon S3
#
# The Flask container is bound only to localhost.
# Apache will later act as the public reverse proxy.
# ============================================================================

services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: image_gallery_app

    env_file:
      - /home/imagegallery/.env

    ports:
      - "127.0.0.1:5000:5000"

    networks:
      - gallery_network

    restart: unless-stopped

    command:
      - gunicorn
      - --workers
      - "4"
      - --bind
      - 0.0.0.0:5000
      - run:app

networks:
  gallery_network:
    driver: bridge
